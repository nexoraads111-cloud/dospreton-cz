<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Recenze · DOSPRETON</title>
    <meta name="theme-color" content="#050505" />
    <style>
      :root {
        --bg: #050505;
        --panel: #161616;
        --gold: #e0b43a;
        --text: #f5f5f5;
        --muted: #b5b5b5;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background:
          radial-gradient(ellipse at 30% 20%, rgba(224, 180, 58, 0.12), transparent 55%),
          var(--bg);
        color: var(--text);
        font-family: Manrope, system-ui, sans-serif;
      }
      .card {
        width: min(100%, 440px);
        background: var(--panel);
        border: 1px solid rgba(224, 180, 58, 0.35);
        padding: 1.75rem 1.5rem;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-family: 'Barlow Condensed', system-ui, sans-serif;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-size: 1.55rem;
        color: var(--gold);
      }
      p {
        margin: 0;
        line-height: 1.55;
        color: var(--muted);
      }
      .hint {
        margin-top: 1rem;
        font-size: 0.9rem;
      }
      a {
        color: var(--gold);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1 id="title">Recenze</h1>
      <p id="message">Zpracovávám…</p>
      <p class="hint" id="hint">Za chvíli vás přesměrujeme na web.</p>
    </div>
    <script>
      (function () {
        var params = new URLSearchParams(location.search)
        var stav = (params.get('stav') || '').toLowerCase()
        var site = '/'
        var map = {
          schvalena: {
            title: 'Recenze schválena',
            message: 'Recenze je nyní veřejná v sekci Recenze na webu.',
          },
          odmitnuta: {
            title: 'Recenze odmítnuta',
            message: 'Recenze byla skryta a na webu se nezobrazí.',
          },
          neplatny: {
            title: 'Neplatný odkaz',
            message: 'Odkaz pro schválení nebo zrušení není platný nebo vypršel.',
          },
          nenalezena: {
            title: 'Recenze nenalezena',
            message: 'Tato recenze už neexistuje.',
          },
          chyba: {
            title: 'Chyba',
            message: 'Stav recenze se nepodařilo změnit. Zkuste to prosím znovu z e-mailu.',
          },
        }
        var info = map[stav] || map.chyba
        document.getElementById('title').textContent = info.title
        document.getElementById('message').textContent = info.message
        document.title = info.title + ' · DOSPRETON'
        var target = site + '#recenze'
        document.getElementById('hint').innerHTML =
          'Přesměrování na <a href="' + target + '">Recenze</a> za 2&nbsp;s…'
        setTimeout(function () {
          location.replace(target)
        }, 2000)
      })()
    </script>
  </body>
</html>
